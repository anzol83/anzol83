name: Generate Datas
on:
  schedule: # execute every 12 hours
    - cron: "* */12 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    steps:
      # Step 1: 
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Snake Animation
      - uses: Platane/snk@v2
        id: snake-gif
        with:
          github_user_name: anzol83
          svg_out_path: dist/github-contribution-grid-snake.svg

      # Step 3: 
      - name: Setup output branch
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git checkout -b output

      # Step 4: 
      - name: Move SVG to output directory
        run: |
          mkdir -p output
          mv dist/github-contribution-grid-snake.svg output/

      # Step 5: 
      - name: Commit and push changes to output branch
        run: |
          git add output/github-contribution-grid-snake.svg
          git commit -m "Update contribution grid snake"
          git push origin output --force

      # Step 6:
      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output
          build_dir: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
